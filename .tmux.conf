unbind C-b
set -g prefix `
bind-key ` last-window
# Repeat e to send-prefix
bind-key -r e send-prefix

bind-key \" split-window -v -c "#{pane_current_path}"
bind-key  % split-window -h -c "#{pane_current_path}"
# bind-key  c new-window

# break the pane into window
bind-key B break-pane -d

bind-key t choose-tree

# Map few keys to resize pane 
bind-key -r H resize-pane -L 2
bind-key -r L resize-pane -R 2
bind-key -r J resize-pane -D 1

bind-key -r K resize-pane -U 1

bind-key -r h select-pane -L
bind-key -r l select-pane -R
bind-key -r j select-pane -D
bind-key -r k select-pane -U

set-option -g default-terminal "screen-256color"

set-option -g status-keys "emacs"

set-option -g status-left "[#S]"
#set-option -g status-right '#(/Users/s4ch1n/Study/SL/lab2/sysStat/sysStat.sh)'
set-option -g status-right "CPU_LOAD"
set-option -g status-left-length 50
#
set-option -g status-justify centre
#
set-option -g status-bg colour234
set-option -g status-fg colour137
#
setw -g window-status-current-format '#I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F'
setw -g window-status-format '#I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F'

#
set-option -sg escape-time 10
set-option -g allow-passthrough on

bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded";

setw -g mode-keys vi

set-option -g history-limit 100000
bind-key T split-window -h -c ~/ "vi ~/todo.md"
bind-key w split-window -h -c '/Users/s4ch1n/Library/Mobile Documents/iCloud~md~obsidian/Documents' 'vi "$(fzf)"'
# bind s split-window -v "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

bind-key b send-keys 'tat' 'C-m'
bind-key K run-shell 'tmux switch-client -n \; kill-session -t "$(tmux display-message -p "#S")" || tmux kill-session'

